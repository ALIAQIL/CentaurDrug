apiVersion: v1
kind: ConfigMap
metadata:
  name: centaurdrug-airflow-config
  namespace: centaurdrug
  labels:
    app.kubernetes.io/name: centaurdrug
    app.kubernetes.io/component: airflow
data:
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://centaurdrug-airflow-service:8080/execution/
  AIRFLOW__API_AUTH__JWT_ISSUER: centaurdrug-airflow
  AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  CENTAURDRUG_PROJECT_ROOT: /opt/airflow/centaurdrug
  PYTHONPATH: /opt/airflow/centaurdrug
  MLFLOW_TRACKING_URI: http://centaurdrug-mlflow-service:5000
  CENTAURDRUG_AIRFLOW_MLFLOW_TRACKING_URI: http://centaurdrug-mlflow-service:5000
  CENTAURDRUG_MLFLOW_MODEL_ALIAS: staging
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: centaurdrug-airflow-artifacts-pvc
  namespace: centaurdrug
  labels:
    app.kubernetes.io/name: centaurdrug
    app.kubernetes.io/component: airflow-scheduler
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: centaurdrug-airflow-migrate
  namespace: centaurdrug
  labels:
    app.kubernetes.io/name: centaurdrug
    app.kubernetes.io/component: airflow-migrate
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: centaurdrug
        app.kubernetes.io/component: airflow-migrate
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 50000
        runAsGroup: 0
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/aliaqil/centaurdrug-airflow:latest
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -c
          args:
            - |
              set -euo pipefail
              until airflow db check; do sleep 5; done
              airflow db migrate
              if airflow users list --output json | grep -q "\"username\": \"${AIRFLOW_ADMIN_USERNAME}\""; then
                airflow users reset-password \
                  --username "${AIRFLOW_ADMIN_USERNAME}" \
                  --password "${AIRFLOW_ADMIN_PASSWORD}"
              else
                airflow users create \
                  --username "${AIRFLOW_ADMIN_USERNAME}" \
                  --password "${AIRFLOW_ADMIN_PASSWORD}" \
                  --firstname CentaurDrug \
                  --lastname Admin \
                  --role Admin \
                  --email admin@centaurdrug.local
              fi
          envFrom:
            - configMapRef:
                name: centaurdrug-airflow-config
            - secretRef:
                name: centaurdrug-airflow-secret
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: centaurdrug-airflow-api-server
  namespace: centaurdrug
  labels:
    app.kubernetes.io/name: centaurdrug
    app.kubernetes.io/component: airflow-api-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: centaurdrug
      app.kubernetes.io/component: airflow-api-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: centaurdrug
        app.kubernetes.io/component: airflow-api-server
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 50000
        runAsGroup: 0
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-migrations
          image: ghcr.io/aliaqil/centaurdrug-airflow:latest
          imagePullPolicy: IfNotPresent
          args:
            - db
            - check-migrations
            - --migration-wait-timeout
            - "300"
          envFrom:
            - configMapRef:
                name: centaurdrug-airflow-config
            - secretRef:
                name: centaurdrug-airflow-secret
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: api-server
          image: ghcr.io/aliaqil/centaurdrug-airflow:latest
          imagePullPolicy: IfNotPresent
          args:
            - api-server
          envFrom:
            - configMapRef:
                name: centaurdrug-airflow-config
            - secretRef:
                name: centaurdrug-airflow-secret
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/v2/monitor/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/v2/monitor/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: centaurdrug-airflow-service
  namespace: centaurdrug
  labels:
    app.kubernetes.io/name: centaurdrug
    app.kubernetes.io/component: airflow-api-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: centaurdrug
    app.kubernetes.io/component: airflow-api-server
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: centaurdrug-airflow-scheduler
  namespace: centaurdrug
  labels:
    app.kubernetes.io/name: centaurdrug
    app.kubernetes.io/component: airflow-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: centaurdrug
      app.kubernetes.io/component: airflow-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: centaurdrug
        app.kubernetes.io/component: airflow-scheduler
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsUser: 50000
        runAsGroup: 0
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-migrations
          image: ghcr.io/aliaqil/centaurdrug-airflow:latest
          imagePullPolicy: IfNotPresent
          args:
            - db
            - check-migrations
            - --migration-wait-timeout
            - "300"
          envFrom:
            - configMapRef:
                name: centaurdrug-airflow-config
            - secretRef:
                name: centaurdrug-airflow-secret
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: scheduler
          image: ghcr.io/aliaqil/centaurdrug-airflow:latest
          imagePullPolicy: IfNotPresent
          args:
            - scheduler
          envFrom:
            - configMapRef:
                name: centaurdrug-airflow-config
            - secretRef:
                name: centaurdrug-airflow-secret
          ports:
            - name: health
              containerPort: 8974
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: artifacts
              mountPath: /opt/airflow/persistent
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: centaurdrug-airflow-artifacts-pvc
---
