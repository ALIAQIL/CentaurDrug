apiVersion: v1
kind: Secret
metadata:
  name: centaurdrug-airflow-secret
  labels:
    app.kubernetes.io/name: centaurdrug
    app.kubernetes.io/component: airflow
type: Opaque
stringData:
  # Replace these values before exposing Airflow outside a private cluster.
  AIRFLOW_ADMIN_USERNAME: airflow
  AIRFLOW_ADMIN_PASSWORD: airflow
  AIRFLOW_FERNET_KEY: NnIRre6whc13QsNY_jhqzYH3reo1D0vLU5dcyUjAFBY=
  AIRFLOW_JWT_SECRET: 859aa76632bf6766ed7010725da71f1a93e29f4db8e83928b3ec4ac909337456
  POSTGRES_PASSWORD: airflow
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: centaurdrug-airflow-postgres-pvc
  labels:
    app.kubernetes.io/name: centaurdrug
    app.kubernetes.io/component: airflow-postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: centaurdrug-airflow-postgres
  labels:
    app.kubernetes.io/name: centaurdrug
    app.kubernetes.io/component: airflow-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: centaurdrug
      app.kubernetes.io/component: airflow-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: centaurdrug
        app.kubernetes.io/component: airflow-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: airflow
            - name: POSTGRES_USER
              value: airflow
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: centaurdrug-airflow-secret
                  key: POSTGRES_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - airflow
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - airflow
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: centaurdrug-airflow-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: centaurdrug-airflow-postgres-service
  labels:
    app.kubernetes.io/name: centaurdrug
    app.kubernetes.io/component: airflow-postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: centaurdrug
    app.kubernetes.io/component: airflow-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: centaurdrug-airflow-dags-pvc
  labels:
    app.kubernetes.io/name: centaurdrug
    app.kubernetes.io/component: airflow
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: centaurdrug-airflow-logs-pvc
  labels:
    app.kubernetes.io/name: centaurdrug
    app.kubernetes.io/component: airflow
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: centaurdrug-airflow
  labels:
    app.kubernetes.io/name: centaurdrug
    app.kubernetes.io/component: airflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: centaurdrug
      app.kubernetes.io/component: airflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: centaurdrug
        app.kubernetes.io/component: airflow
    spec:
      securityContext:
        fsGroup: 0
      initContainers:
        - name: prepare-airflow-volumes
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              mkdir -p /opt/airflow/dags /opt/airflow/logs
              chown -R 50000:0 /opt/airflow/dags /opt/airflow/logs
              chmod -R g+rwX /opt/airflow/dags /opt/airflow/logs
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: airflow-dags
              mountPath: /opt/airflow/dags
            - name: airflow-logs
              mountPath: /opt/airflow/logs
        - name: wait-for-postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h centaurdrug-airflow-postgres-service -U airflow; do
                sleep 2
              done
        - name: airflow-init
          image: apache/airflow:3.2.2
          imagePullPolicy: IfNotPresent
          args:
            - version
          env:
            - name: AIRFLOW__CORE__EXECUTOR
              value: LocalExecutor
            - name: AIRFLOW__CORE__AUTH_MANAGER
              value: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: centaurdrug-airflow-secret
                  key: POSTGRES_PASSWORD
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: postgresql+psycopg2://airflow:$(POSTGRES_PASSWORD)@centaurdrug-airflow-postgres-service:5432/airflow
            - name: AIRFLOW__CORE__FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: centaurdrug-airflow-secret
                  key: AIRFLOW_FERNET_KEY
            - name: AIRFLOW__API_AUTH__JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: centaurdrug-airflow-secret
                  key: AIRFLOW_JWT_SECRET
            - name: AIRFLOW__API_AUTH__JWT_ISSUER
              value: centaurdrug-airflow
            - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
              value: "true"
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "false"
            - name: AIRFLOW__CORE__EXECUTION_API_SERVER_URL
              value: http://centaurdrug-airflow-service:8080/execution/
            - name: AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK
              value: "true"
            - name: _AIRFLOW_DB_MIGRATE
              value: "true"
            - name: _AIRFLOW_WWW_USER_CREATE
              value: "true"
            - name: _AIRFLOW_WWW_USER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: centaurdrug-airflow-secret
                  key: AIRFLOW_ADMIN_USERNAME
            - name: _AIRFLOW_WWW_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: centaurdrug-airflow-secret
                  key: AIRFLOW_ADMIN_PASSWORD
          volumeMounts:
            - name: airflow-dags
              mountPath: /opt/airflow/dags
            - name: airflow-logs
              mountPath: /opt/airflow/logs
      containers:
        - name: api-server
          image: apache/airflow:3.2.2
          imagePullPolicy: IfNotPresent
          args:
            - api-server
          env:
            - name: AIRFLOW__CORE__EXECUTOR
              value: LocalExecutor
            - name: AIRFLOW__CORE__AUTH_MANAGER
              value: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: centaurdrug-airflow-secret
                  key: POSTGRES_PASSWORD
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: postgresql+psycopg2://airflow:$(POSTGRES_PASSWORD)@centaurdrug-airflow-postgres-service:5432/airflow
            - name: AIRFLOW__CORE__FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: centaurdrug-airflow-secret
                  key: AIRFLOW_FERNET_KEY
            - name: AIRFLOW__API_AUTH__JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: centaurdrug-airflow-secret
                  key: AIRFLOW_JWT_SECRET
            - name: AIRFLOW__API_AUTH__JWT_ISSUER
              value: centaurdrug-airflow
            - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
              value: "true"
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "false"
            - name: AIRFLOW__CORE__EXECUTION_API_SERVER_URL
              value: http://centaurdrug-airflow-service:8080/execution/
            - name: AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK
              value: "true"
            - name: MLFLOW_TRACKING_URI
              value: http://centaurdrug-mlflow-service:5000
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/v2/monitor/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/v2/monitor/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: airflow-dags
              mountPath: /opt/airflow/dags
            - name: airflow-logs
              mountPath: /opt/airflow/logs
        - name: scheduler
          image: apache/airflow:3.2.2
          imagePullPolicy: IfNotPresent
          args:
            - scheduler
          env:
            - name: AIRFLOW__CORE__EXECUTOR
              value: LocalExecutor
            - name: AIRFLOW__CORE__AUTH_MANAGER
              value: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: centaurdrug-airflow-secret
                  key: POSTGRES_PASSWORD
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: postgresql+psycopg2://airflow:$(POSTGRES_PASSWORD)@centaurdrug-airflow-postgres-service:5432/airflow
            - name: AIRFLOW__CORE__FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: centaurdrug-airflow-secret
                  key: AIRFLOW_FERNET_KEY
            - name: AIRFLOW__API_AUTH__JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: centaurdrug-airflow-secret
                  key: AIRFLOW_JWT_SECRET
            - name: AIRFLOW__API_AUTH__JWT_ISSUER
              value: centaurdrug-airflow
            - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
              value: "true"
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "false"
            - name: AIRFLOW__CORE__EXECUTION_API_SERVER_URL
              value: http://centaurdrug-airflow-service:8080/execution/
            - name: AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK
              value: "true"
            - name: MLFLOW_TRACKING_URI
              value: http://centaurdrug-mlflow-service:5000
          ports:
            - name: scheduler
              containerPort: 8974
          livenessProbe:
            httpGet:
              path: /health
              port: scheduler
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: airflow-dags
              mountPath: /opt/airflow/dags
            - name: airflow-logs
              mountPath: /opt/airflow/logs
        - name: dag-processor
          image: apache/airflow:3.2.2
          imagePullPolicy: IfNotPresent
          args:
            - dag-processor
          env:
            - name: AIRFLOW__CORE__EXECUTOR
              value: LocalExecutor
            - name: AIRFLOW__CORE__AUTH_MANAGER
              value: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: centaurdrug-airflow-secret
                  key: POSTGRES_PASSWORD
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: postgresql+psycopg2://airflow:$(POSTGRES_PASSWORD)@centaurdrug-airflow-postgres-service:5432/airflow
            - name: AIRFLOW__CORE__FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: centaurdrug-airflow-secret
                  key: AIRFLOW_FERNET_KEY
            - name: AIRFLOW__API_AUTH__JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: centaurdrug-airflow-secret
                  key: AIRFLOW_JWT_SECRET
            - name: AIRFLOW__API_AUTH__JWT_ISSUER
              value: centaurdrug-airflow
            - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
              value: "true"
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "false"
            - name: AIRFLOW__CORE__EXECUTION_API_SERVER_URL
              value: http://centaurdrug-airflow-service:8080/execution/
            - name: AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK
              value: "true"
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - airflow jobs check --job-type DagProcessorJob --hostname "$HOSTNAME"
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 750m
              memory: 1Gi
          volumeMounts:
            - name: airflow-dags
              mountPath: /opt/airflow/dags
            - name: airflow-logs
              mountPath: /opt/airflow/logs
        - name: triggerer
          image: apache/airflow:3.2.2
          imagePullPolicy: IfNotPresent
          args:
            - triggerer
          env:
            - name: AIRFLOW__CORE__EXECUTOR
              value: LocalExecutor
            - name: AIRFLOW__CORE__AUTH_MANAGER
              value: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: centaurdrug-airflow-secret
                  key: POSTGRES_PASSWORD
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: postgresql+psycopg2://airflow:$(POSTGRES_PASSWORD)@centaurdrug-airflow-postgres-service:5432/airflow
            - name: AIRFLOW__CORE__FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: centaurdrug-airflow-secret
                  key: AIRFLOW_FERNET_KEY
            - name: AIRFLOW__API_AUTH__JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: centaurdrug-airflow-secret
                  key: AIRFLOW_JWT_SECRET
            - name: AIRFLOW__API_AUTH__JWT_ISSUER
              value: centaurdrug-airflow
            - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
              value: "true"
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "false"
            - name: AIRFLOW__CORE__EXECUTION_API_SERVER_URL
              value: http://centaurdrug-airflow-service:8080/execution/
            - name: AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK
              value: "true"
          livenessProbe:
            exec:
              command:
                - bash
                - -c
                - airflow jobs check --job-type TriggererJob --hostname "$HOSTNAME"
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 750m
              memory: 1Gi
          volumeMounts:
            - name: airflow-dags
              mountPath: /opt/airflow/dags
            - name: airflow-logs
              mountPath: /opt/airflow/logs
      volumes:
        - name: airflow-dags
          persistentVolumeClaim:
            claimName: centaurdrug-airflow-dags-pvc
        - name: airflow-logs
          persistentVolumeClaim:
            claimName: centaurdrug-airflow-logs-pvc
