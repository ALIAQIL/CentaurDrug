apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: centaurdrug-mlflow-artifacts-pvc
  namespace: centaurdrug
  labels:
    app.kubernetes.io/name: centaurdrug
    app.kubernetes.io/component: mlflow
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: centaurdrug-mlflow
  namespace: centaurdrug
  labels:
    app.kubernetes.io/name: centaurdrug
    app.kubernetes.io/component: mlflow
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: centaurdrug-mlflow
  namespace: centaurdrug
  labels:
    app.kubernetes.io/name: centaurdrug
    app.kubernetes.io/component: mlflow
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: centaurdrug
      app.kubernetes.io/component: mlflow
  template:
    metadata:
      labels:
        app.kubernetes.io/name: centaurdrug
        app.kubernetes.io/component: mlflow
    spec:
      serviceAccountName: centaurdrug-mlflow
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mlflow
          image: ghcr.io/aliaqil/centaurdrug-mlflow:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: centaurdrug-mlflow-server-secret
          env:
            - name: MLFLOW_HOST
              value: 0.0.0.0
            - name: MLFLOW_PORT
              value: "5000"
            - name: MLFLOW_WORKERS
              value: "2"
            - name: MLFLOW_AUTH_CONFIG_PATH
              value: /var/run/mlflow/basic_auth.ini
            - name: HOME
              value: /var/run/mlflow
          ports:
            - name: http
              containerPort: 5000
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: artifacts
              mountPath: /mlflow/artifacts
            - name: runtime
              mountPath: /var/run/mlflow
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: centaurdrug-mlflow-artifacts-pvc
        - name: runtime
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: centaurdrug-mlflow-service
  namespace: centaurdrug
  labels:
    app.kubernetes.io/name: centaurdrug
    app.kubernetes.io/component: mlflow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: centaurdrug
    app.kubernetes.io/component: mlflow
  ports:
    - name: http
      port: 5000
      targetPort: http
