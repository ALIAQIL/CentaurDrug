apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: centaurdrug-models-pvc
  namespace: centaurdrug
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: centaurdrug-api
  namespace: centaurdrug
spec:
  replicas: 1
  selector:
    matchLabels:
      app: centaurdrug-api
  template:
    metadata:
      labels:
        app: centaurdrug-api
    spec:
      containers:
        - name: api
          image: centaurdrug-api:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: CENTAURDRUG_MODEL_ROOT
              value: /app/models/admet_xgboost
            - name: CENTAURDRUG_ALLOWED_MODEL_ROOTS
              value: /app/models/admet_xgboost
            - name: CENTAURDRUG_REQUIRE_MODELS_ON_STARTUP
              value: "1"
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: admet-models
              mountPath: /app/models/admet_xgboost
              readOnly: true
      volumes:
        - name: admet-models
          persistentVolumeClaim:
            claimName: centaurdrug-models-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: centaurdrug-api-service
  namespace: centaurdrug
spec:
  selector:
    app: centaurdrug-api
  ports:
    - port: 8000
      targetPort: 8000
  type: NodePort
