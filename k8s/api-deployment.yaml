apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: centaurdrug-models-pvc
  namespace: centaurdrug
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: centaurdrug-api
  namespace: centaurdrug
spec:
  replicas: 1
  selector:
    matchLabels:
      app: centaurdrug-api
  template:
    metadata:
      labels:
        app: centaurdrug-api
        app.kubernetes.io/name: centaurdrug
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: centaurdrug-api:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: CENTAURDRUG_MODEL_ROOT
              value: /app/models/admet_xgboost
            - name: CENTAURDRUG_ALLOWED_MODEL_ROOTS
              value: /app/models/admet_xgboost
            - name: CENTAURDRUG_REQUIRE_MODELS_ON_STARTUP
              value: "1"
            - name: CENTAURDRUG_ENVIRONMENT
              value: production
            - name: CENTAURDRUG_APP_VERSION
              value: kubernetes
            - name: LANGSMITH_TRACING
              value: "false"
            - name: LANGSMITH_PROJECT
              value: centaurdrug-production
            - name: LANGSMITH_ENDPOINT
              value: https://api.smith.langchain.com
            - name: LANGSMITH_WORKSPACE_ID
              valueFrom:
                secretKeyRef:
                  name: centaurdrug-api-secret
                  key: LANGSMITH_WORKSPACE_ID
                  optional: true
            - name: LANGSMITH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: centaurdrug-api-secret
                  key: LANGSMITH_API_KEY
                  optional: true
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: centaurdrug-api-secret
                  key: GEMINI_API_KEY
                  optional: true
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: admet-models
              mountPath: /app/models/admet_xgboost
              readOnly: true
      volumes:
        - name: admet-models
          persistentVolumeClaim:
            claimName: centaurdrug-models-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: centaurdrug-api-service
  namespace: centaurdrug
  labels:
    app.kubernetes.io/name: centaurdrug
    app.kubernetes.io/component: api
spec:
  selector:
    app: centaurdrug-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: NodePort
