apiVersion: batch/v1
kind: Job
metadata:
  name: centaurdrug-mlflow-migrate
  namespace: centaurdrug
  labels:
    app.kubernetes.io/name: centaurdrug
    app.kubernetes.io/component: mlflow-migrate
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: centaurdrug
        app.kubernetes.io/component: mlflow-migrate
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/aliaqil/centaurdrug-mlflow:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              mlflow db upgrade "${MLFLOW_BACKEND_STORE_URI}"
              python -m mlflow.server.auth db upgrade \
                --url "${MLFLOW_AUTH_DATABASE_URI}"
          envFrom:
            - secretRef:
                name: centaurdrug-mlflow-server-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
