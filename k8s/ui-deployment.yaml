apiVersion: apps/v1
kind: Deployment
metadata:
  name: centaurdrug-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: centaurdrug-ui
  template:
    metadata:
      labels:
        app: centaurdrug-ui
    spec:
      containers:
        - name: ui
          image: centaurdrug-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
---
apiVersion: v1
kind: Service
metadata:
  name: centaurdrug-ui-service
spec:
  selector:
    app: centaurdrug-ui
  ports:
    - port: 8501
      targetPort: 8501
  type: NodePort