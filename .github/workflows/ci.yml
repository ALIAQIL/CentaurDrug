name: CI/CD

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to Kubernetes after publishing images"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  checks:
    name: Python checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        # Why: the runner starts empty, so this makes the repository files available.
        uses: actions/checkout@v6.0.3

      - name: Install uv with cache
        # Why: uv installs Python dependencies quickly, and caching reduces repeat CI time.
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install project Python
        # Why: this respects .python-version, so CI uses the same Python major/minor as the project.
        run: uv python install

      - name: Install dependencies
        # Why: tests import runtime, training, plotting, and dev tooling.
        run: uv sync --locked --group dev --group training

      - name: Lint
        # Why: ruff catches syntax, import, and style issues before slower tests or deploy steps run.
        run: uv run ruff check src tests

      - name: Tests
        # Why: pytest verifies the API, model helpers, agent logic, and validation code still behave.
        run: uv run pytest

      - name: API smoke test
        # Why: unit tests can pass while the app startup is broken, so this boots FastAPI and hits /health.
        run: |
          set -euo pipefail
          uv run uvicorn src.api.main:app --host 127.0.0.1 --port 8000 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done

          echo "API did not become healthy after ${attempt} attempts."
          exit 1

  api-container-smoke:
    name: API container smoke test
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        # Why: the smoke test builds the real API image from the repository.
        uses: actions/checkout@v6.0.3

      - name: Install uv with cache
        # Why: the smoke model artifacts are generated by a small project module.
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install project Python
        # Why: this respects .python-version before generating smoke artifacts.
        run: uv python install

      - name: Install dependencies
        # Why: the smoke artifact helper needs runtime packages plus test helpers.
        run: uv sync --locked --group dev

      - name: Generate smoke model artifacts
        # Why: production images receive models by mount, so CI creates a tiny mounted model panel.
        run: uv run python -m src.mlops.smoke_artifacts --output-dir /tmp/centaurdrug-smoke-models

      - name: Build API image locally
        # Why: container build must succeed before the image can be smoke-tested or published.
        run: docker build -f Dockerfile.api -t centaurdrug-api-smoke .

      - name: Run API container smoke test
        # Why: /health alone is too shallow; this proves mounted models work through /evaluate.
        run: |
          set -euo pipefail

          docker run --rm -d \
            --name centaurdrug-api-smoke \
            -p 8000:8000 \
            -v /tmp/centaurdrug-smoke-models:/app/models/admet_xgboost:ro \
            -e CENTAURDRUG_MODEL_ROOT=/app/models/admet_xgboost \
            -e CENTAURDRUG_ALLOWED_MODEL_ROOTS=/app/models/admet_xgboost \
            -e CENTAURDRUG_REQUIRE_MODELS_ON_STARTUP=1 \
            centaurdrug-api-smoke

          trap 'docker logs centaurdrug-api-smoke || true; docker rm -f centaurdrug-api-smoke || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/ready; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:8000/health
          curl --fail --silent \
            --header "Content-Type: application/json" \
            --data '{"smiles":"CCO"}' \
            http://127.0.0.1:8000/rules
          curl --fail --silent \
            --header "Content-Type: application/json" \
            --data '{"smiles":"CCO"}' \
            http://127.0.0.1:8000/evaluate

  containers:
    name: Container image
    needs:
      - checks
      - api-container-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        # Why: Docker needs the project files as build context.
        uses: actions/checkout@v6.0.3

      - name: Set up Docker Buildx
        # Why: Buildx enables cache-backed, repeatable image builds on GitHub runners.
        uses: docker/setup-buildx-action@v4.1.0

      - name: Log in to GHCR
        # Why: pushes to ghcr.io need authentication; PRs only build, so they skip login.
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: meta
        # Why: metadata-action creates consistent tags such as sha-..., main, latest, and release tags.
        uses: docker/metadata-action@v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-api
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image
        id: build
        # Why: PRs validate that Docker builds; main/tags/manual runs also publish the image.
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ./Dockerfile.api
          push: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  deploy:
    name: Deploy to Kubernetes
    needs: containers
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy) }}
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout source
        # Why: deployment uses the Kubernetes manifests stored in this repository.
        uses: actions/checkout@v6.0.3

      - name: Prepare deployment config
        id: deploy_config
        # Why: GHCR image names must be lowercase, and the kubeconfig secret may not exist yet.
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          image_repo="${GITHUB_REPOSITORY,,}"
          echo "API_IMAGE=ghcr.io/${image_repo}-api:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"

          if [ -n "$KUBE_CONFIG" ]; then
            echo "has_kube_config=true" >> "$GITHUB_OUTPUT"
            mkdir -p "$HOME/.kube"
            printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
            chmod 600 "$HOME/.kube/config"
          else
            echo "has_kube_config=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip deploy when kubeconfig is missing
        # Why: image publishing should still succeed even before a cluster secret is configured.
        if: ${{ steps.deploy_config.outputs.has_kube_config == 'false' }}
        run: echo "KUBE_CONFIG is not configured; images were published, but Kubernetes deployment was skipped."

      - name: Install kubectl
        # Why: kubectl is the CLI that applies manifests and waits for Kubernetes rollouts.
        if: ${{ steps.deploy_config.outputs.has_kube_config == 'true' }}
        uses: azure/setup-kubectl@v5.1.0
        with:
          version: latest

      - name: Apply manifests and deploy images
        # Why: apply creates/updates the services, then set image rolls out the exact commit that passed CI.
        if: ${{ steps.deploy_config.outputs.has_kube_config == 'true' }}
        run: |
          set -euo pipefail
          kubectl apply -f k8s/api-deployment.yaml
          kubectl set image deployment/centaurdrug-api api="$API_IMAGE"

      - name: Wait for rollout
        # Why: the workflow should fail if Kubernetes cannot start the new pods successfully.
        if: ${{ steps.deploy_config.outputs.has_kube_config == 'true' }}
        run: |
          kubectl rollout status deployment/centaurdrug-api --timeout=180s
