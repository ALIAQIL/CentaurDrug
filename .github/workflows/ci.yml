name: CI/CD

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to Kubernetes after publishing images"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  checks:
    name: Python checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        # Why: the runner starts empty, so this makes the repository files available.
        uses: actions/checkout@v6.0.3

      - name: Install uv with cache
        # Why: uv installs Python dependencies quickly, and caching reduces repeat CI time.
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install project Python
        # Why: this respects .python-version, so CI uses the same Python major/minor as the project.
        run: uv python install

      - name: Install dependencies
        # Why: tests import runtime, training, plotting, and dev tooling.
        run: uv sync --locked --group dev --group training --group mlops --group orchestration

      - name: Lint
        # Why: ruff catches syntax, import, and style issues before slower tests or deploy steps run.
        run: uv run ruff check src tests dags

      - name: Validate Airflow DAG imports
        # Why: executing the DAG module catches broken Airflow imports and task construction before image build.
        run: uv run --group orchestration python dags/centaurdrug_training_pipeline.py

      - name: Tests
        # Why: pytest verifies the API, model helpers, agent logic, and validation code still behave.
        run: uv run pytest

      - name: API smoke test
        # Why: unit tests can pass while the app startup is broken, so this boots FastAPI and hits /health.
        run: |
          set -euo pipefail
          uv run uvicorn src.api.main:app --host 127.0.0.1 --port 8000 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done

          echo "API did not become healthy after ${attempt} attempts."
          exit 1

  api-container-smoke:
    name: API container smoke test
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        # Why: the smoke test builds the real API image from the repository.
        uses: actions/checkout@v6.0.3

      - name: Install uv with cache
        # Why: the smoke model artifacts are generated by a small project module.
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Install project Python
        # Why: this respects .python-version before generating smoke artifacts.
        run: uv python install

      - name: Install dependencies
        # Why: the smoke artifact helper needs runtime packages plus test helpers.
        run: uv sync --locked --group dev

      - name: Generate smoke model artifacts
        # Why: production images receive models by mount, so CI creates a tiny mounted model panel.
        run: uv run python -m src.mlops.smoke_artifacts --output-dir /tmp/centaurdrug-smoke-models

      - name: Build API image locally
        # Why: container build must succeed before the image can be smoke-tested or published.
        run: docker build -f Dockerfile.api -t centaurdrug-api-smoke .

      - name: Run API container smoke test
        # Why: /health alone is too shallow; this proves mounted models work through /evaluate.
        run: |
          set -euo pipefail

          docker run --rm -d \
            --name centaurdrug-api-smoke \
            -p 8000:8000 \
            -v /tmp/centaurdrug-smoke-models:/app/models/admet_xgboost:ro \
            -e CENTAURDRUG_MODEL_ROOT=/app/models/admet_xgboost \
            -e CENTAURDRUG_ALLOWED_MODEL_ROOTS=/app/models/admet_xgboost \
            -e CENTAURDRUG_REQUIRE_MODELS_ON_STARTUP=1 \
            centaurdrug-api-smoke

          trap 'docker logs centaurdrug-api-smoke || true; docker rm -f centaurdrug-api-smoke || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/ready; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:8000/health
          curl --fail --silent \
            --header "Content-Type: application/json" \
            --data '{"smiles":"CCO"}' \
            http://127.0.0.1:8000/rules
          curl --fail --silent \
            --header "Content-Type: application/json" \
            --data '{"smiles":"CCO"}' \
            http://127.0.0.1:8000/evaluate

  containers:
    name: Container image
    needs:
      - checks
      - api-container-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source
        # Why: Docker needs the project files as build context.
        uses: actions/checkout@v6.0.3

      - name: Set up Docker Buildx
        # Why: Buildx enables cache-backed, repeatable image builds on GitHub runners.
        uses: docker/setup-buildx-action@v4.1.0

      - name: Log in to GHCR
        # Why: pushes to ghcr.io need authentication; PRs only build, so they skip login.
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare lowercase image names
        id: image_names
        # Why: GHCR rejects repository paths that contain uppercase characters.
        run: |
          image_repo="${GITHUB_REPOSITORY,,}"
          echo "api=ghcr.io/${image_repo}-api" >> "$GITHUB_OUTPUT"
          echo "airflow=ghcr.io/${image_repo}-airflow" >> "$GITHUB_OUTPUT"
          echo "mlflow=ghcr.io/${image_repo}-mlflow" >> "$GITHUB_OUTPUT"

      - name: Prepare API image tags
        id: api_meta
        # Why: metadata-action creates consistent tags such as sha-..., main, latest, and release tags.
        uses: docker/metadata-action@v6.1.0
        with:
          images: ${{ steps.image_names.outputs.api }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build API image
        id: api_build
        # Why: PRs validate that Docker builds; main/tags/manual runs also publish the image.
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ./Dockerfile.api
          push: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.api_meta.outputs.tags }}
          labels: ${{ steps.api_meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Prepare Airflow image tags
        id: airflow_meta
        # Why: the scheduler image is versioned independently but uses the same immutable commit tag.
        uses: docker/metadata-action@v6.1.0
        with:
          images: ${{ steps.image_names.outputs.airflow }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Airflow image
        id: airflow_build
        # Why: this image carries the locked training stack, project source, and versioned DAGs.
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ./Dockerfile.airflow
          push: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.airflow_meta.outputs.tags }}
          labels: ${{ steps.airflow_meta.outputs.labels }}
          cache-from: type=gha,scope=airflow
          cache-to: type=gha,scope=airflow,mode=max

      - name: Prepare MLflow image tags
        id: mlflow_meta
        # Why: the server image must use the same locked MLflow and storage drivers tested by this commit.
        uses: docker/metadata-action@v6.1.0
        with:
          images: ${{ steps.image_names.outputs.mlflow }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build MLflow image
        id: mlflow_build
        # Why: PostgreSQL, GCS, and basic-auth support are packaged from uv.lock instead of relying on a drifting public image.
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: ./Dockerfile.mlflow
          push: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.mlflow_meta.outputs.tags }}
          labels: ${{ steps.mlflow_meta.outputs.labels }}
          cache-from: type=gha,scope=mlflow
          cache-to: type=gha,scope=mlflow,mode=max

  deploy:
    name: Deploy to Kubernetes
    needs: containers
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy) }}
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout source
        # Why: deployment uses the Kubernetes manifests stored in this repository.
        uses: actions/checkout@v6.0.3

      - name: Prepare deployment config
        id: deploy_config
        # Why: GHCR image names must be lowercase, and the kubeconfig secret may not exist yet.
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          image_repo="${GITHUB_REPOSITORY,,}"
          echo "API_IMAGE=ghcr.io/${image_repo}-api:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "AIRFLOW_IMAGE=ghcr.io/${image_repo}-airflow:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "MLFLOW_IMAGE=ghcr.io/${image_repo}-mlflow:sha-${GITHUB_SHA}" >> "$GITHUB_ENV"

          if [ -n "$KUBE_CONFIG" ]; then
            echo "has_kube_config=true" >> "$GITHUB_OUTPUT"
            mkdir -p "$HOME/.kube"
            printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
            chmod 600 "$HOME/.kube/config"
          else
            echo "has_kube_config=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip deploy when kubeconfig is missing
        # Why: image publishing should still succeed even before a cluster secret is configured.
        if: ${{ steps.deploy_config.outputs.has_kube_config == 'false' }}
        run: echo "KUBE_CONFIG is not configured; images were published, but Kubernetes deployment was skipped."

      - name: Install kubectl
        # Why: kubectl is the CLI that applies manifests and waits for Kubernetes rollouts.
        if: ${{ steps.deploy_config.outputs.has_kube_config == 'true' }}
        uses: azure/setup-kubectl@v5.1.0
        with:
          version: latest

      - name: Apply manifests and deploy images
        # Why: GitHub Secrets create the runtime Secret without committing credentials, and every pod gets the tested SHA image.
        if: ${{ steps.deploy_config.outputs.has_kube_config == 'true' }}
        env:
          AIRFLOW_DATABASE_URI: ${{ secrets.AIRFLOW_DATABASE_URI }}
          AIRFLOW_ADMIN_PASSWORD: ${{ secrets.AIRFLOW_ADMIN_PASSWORD }}
          AIRFLOW_FERNET_KEY: ${{ secrets.AIRFLOW_FERNET_KEY }}
          AIRFLOW_JWT_SECRET: ${{ secrets.AIRFLOW_JWT_SECRET }}
          AIRFLOW_POSTGRES_PASSWORD: ${{ secrets.AIRFLOW_POSTGRES_PASSWORD }}
          MLFLOW_DATABASE_URI: ${{ secrets.MLFLOW_DATABASE_URI }}
          MLFLOW_ARTIFACTS_DESTINATION: ${{ secrets.MLFLOW_ARTIFACTS_DESTINATION }}
          MLFLOW_ADMIN_USERNAME: ${{ secrets.MLFLOW_ADMIN_USERNAME }}
          MLFLOW_ADMIN_PASSWORD: ${{ secrets.MLFLOW_ADMIN_PASSWORD }}
          MLFLOW_FLASK_SERVER_SECRET_KEY: ${{ secrets.MLFLOW_FLASK_SERVER_SECRET_KEY }}
          MLFLOW_ALLOWED_HOSTS: ${{ secrets.MLFLOW_ALLOWED_HOSTS }}
          MLFLOW_CORS_ALLOWED_ORIGINS: ${{ secrets.MLFLOW_CORS_ALLOWED_ORIGINS }}
        run: |
          set -euo pipefail
          for secret_name in \
            AIRFLOW_DATABASE_URI \
            AIRFLOW_ADMIN_PASSWORD \
            AIRFLOW_FERNET_KEY \
            AIRFLOW_JWT_SECRET \
            MLFLOW_DATABASE_URI \
            MLFLOW_ARTIFACTS_DESTINATION \
            MLFLOW_ADMIN_USERNAME \
            MLFLOW_ADMIN_PASSWORD \
            MLFLOW_FLASK_SERVER_SECRET_KEY \
            MLFLOW_ALLOWED_HOSTS \
            MLFLOW_CORS_ALLOWED_ORIGINS; do
            if [ -z "${!secret_name}" ]; then
              echo "Required GitHub Secret ${secret_name} is not configured."
              exit 1
            fi
          done

          kubectl apply -f k8s/namespace.yaml
          secret_args=(
            --from-literal=AIRFLOW__DATABASE__SQL_ALCHEMY_CONN="$AIRFLOW_DATABASE_URI"
            --from-literal=AIRFLOW__CORE__FERNET_KEY="$AIRFLOW_FERNET_KEY"
            --from-literal=AIRFLOW__API_AUTH__JWT_SECRET="$AIRFLOW_JWT_SECRET"
            --from-literal=AIRFLOW_ADMIN_USERNAME=admin
            --from-literal=AIRFLOW_ADMIN_PASSWORD="$AIRFLOW_ADMIN_PASSWORD"
          )
          if [ -n "$AIRFLOW_POSTGRES_PASSWORD" ]; then
            secret_args+=(--from-literal=POSTGRES_PASSWORD="$AIRFLOW_POSTGRES_PASSWORD")
          fi
          kubectl -n centaurdrug create secret generic centaurdrug-airflow-secret \
            "${secret_args[@]}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl -n centaurdrug create secret generic centaurdrug-mlflow-server-secret \
            --from-literal=MLFLOW_BACKEND_STORE_URI="$MLFLOW_DATABASE_URI" \
            --from-literal=MLFLOW_AUTH_DATABASE_URI="$MLFLOW_DATABASE_URI" \
            --from-literal=MLFLOW_ARTIFACTS_DESTINATION="$MLFLOW_ARTIFACTS_DESTINATION" \
            --from-literal=MLFLOW_ADMIN_USERNAME="$MLFLOW_ADMIN_USERNAME" \
            --from-literal=MLFLOW_ADMIN_PASSWORD="$MLFLOW_ADMIN_PASSWORD" \
            --from-literal=MLFLOW_FLASK_SERVER_SECRET_KEY="$MLFLOW_FLASK_SERVER_SECRET_KEY" \
            --from-literal=MLFLOW_ALLOWED_HOSTS="$MLFLOW_ALLOWED_HOSTS" \
            --from-literal=MLFLOW_CORS_ALLOWED_ORIGINS="$MLFLOW_CORS_ALLOWED_ORIGINS" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n centaurdrug create secret generic centaurdrug-mlflow-client-secret \
            --from-literal=MLFLOW_TRACKING_USERNAME="$MLFLOW_ADMIN_USERNAME" \
            --from-literal=MLFLOW_TRACKING_PASSWORD="$MLFLOW_ADMIN_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl apply -f k8s/api-deployment.yaml
          kubectl -n centaurdrug set image deployment/centaurdrug-api api="$API_IMAGE"

          kubectl -n centaurdrug delete job centaurdrug-mlflow-migrate \
            --ignore-not-found --wait=true
          sed "s|ghcr.io/aliaqil/centaurdrug-mlflow:latest|${MLFLOW_IMAGE}|g" \
            k8s/mlflow-migrate.yaml | kubectl apply -f -
          if ! kubectl -n centaurdrug wait \
            --for=condition=complete job/centaurdrug-mlflow-migrate \
            --timeout=300s; then
            kubectl -n centaurdrug logs job/centaurdrug-mlflow-migrate
            exit 1
          fi
          sed "s|ghcr.io/aliaqil/centaurdrug-mlflow:latest|${MLFLOW_IMAGE}|g" \
            k8s/mlflow-deployment.yaml | kubectl apply -f -

          kubectl -n centaurdrug delete job centaurdrug-airflow-migrate \
            --ignore-not-found --wait=true
          sed "s|ghcr.io/aliaqil/centaurdrug-airflow:latest|${AIRFLOW_IMAGE}|g" \
            k8s/airflow-deployment.yaml | kubectl apply -f -

          if ! kubectl -n centaurdrug wait \
            --for=condition=complete job/centaurdrug-airflow-migrate \
            --timeout=300s; then
            kubectl -n centaurdrug logs job/centaurdrug-airflow-migrate
            exit 1
          fi

      - name: Wait for rollout
        # Why: the workflow should fail if Kubernetes cannot start the new pods successfully.
        if: ${{ steps.deploy_config.outputs.has_kube_config == 'true' }}
        run: |
          kubectl -n centaurdrug rollout status deployment/centaurdrug-api --timeout=180s
          kubectl -n centaurdrug rollout status deployment/centaurdrug-mlflow --timeout=180s
          kubectl -n centaurdrug rollout status deployment/centaurdrug-airflow-api-server --timeout=300s
          kubectl -n centaurdrug rollout status deployment/centaurdrug-airflow-scheduler --timeout=300s
          kubectl -n centaurdrug rollout status deployment/centaurdrug-airflow-dag-processor --timeout=300s
          kubectl -n centaurdrug rollout status deployment/centaurdrug-airflow-triggerer --timeout=300s
