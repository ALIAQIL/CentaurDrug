stages:
  train_solubility_aqsoldb:
    cmd: uv run python -m src.models.train_admet_xgboost --config configs/training.yaml --dataset Solubility_AqSolDB
    deps:
      - configs/training.yaml
      - pyproject.toml
      - src/models/datasets.py
      - src/models/featurizers.py
      - src/models/metrics.py
      - src/models/splitting.py
      - src/models/train_admet_xgboost.py
      - src/models/validation.py
    outs:
      - models/admet_xgboost/Solubility_AqSolDB/model.joblib
      - models/admet_xgboost/Solubility_AqSolDB/featurizer.joblib
      - models/admet_xgboost/Solubility_AqSolDB/metadata.json
      - models/admet_xgboost/Solubility_AqSolDB/split_report.csv
      - models/admet_xgboost/Solubility_AqSolDB/rejected_molecules.csv
      - models/admet_xgboost/Solubility_AqSolDB/training_fps.joblib
      - models/admet_xgboost/Solubility_AqSolDB/training_smiles.joblib
    metrics:
      - models/admet_xgboost/Solubility_AqSolDB/metrics.json:
          cache: false

  train_lipophilicity_astrazeneca:
