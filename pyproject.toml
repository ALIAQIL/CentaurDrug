[project]
name = "centaurdrug"
version = "0.1.0"
description = "AI medicinal chemistry copilot for human-in-the-loop lead optimization"
readme = "README.md"
requires-python = ">=3.12, <3.14"
dependencies = [
    "fastapi>=0.135.1",
    "joblib>=1.5.3",
    "langchain-google-genai>=4.2.0",
    "langgraph>=1.0.5",
    "numpy>=1.26.4",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "rdkit>=2026.3.2",
    "scikit-learn>=1.8.0",
    "uvicorn>=0.42.0",
    "xgboost>=3.2.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.4.0",
    "pytest>=9.0.0",
    "ruff>=0.14.0",
    "uvloop>=0.22.1",
]
training = [
    "matplotlib>=3.7.2",
    "mlflow>=3.10.1",
    "optuna>=4.8.0",
    "pandas>=2.3.3",
    "pytdc>=0.3.6",
    "pyyaml>=6.0.3",
    "tdc>=0.1",
]
mlops = [
    "dvc>=3.64.2",
    "matplotlib>=3.7.2",
    "mlflow>=3.10.1",
    "pyyaml>=6.0.3",
]
notebook = [
    "jupyter>=1.0.0",
]
orchestration = [
    "apache-airflow>=3.2.1",
    "apache-airflow-providers-fab==3.6.4",
]

[tool.uv.workspace]
members = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
