[project]
name = "centaurdrug"
version = "0.1.0"
description = "AI medicinal chemistry copilot for human-in-the-loop lead optimization"
readme = "README.md"
requires-python = ">=3.12, <3.14"
dependencies = [
    "apache-airflow>=3.2.1",
    "fastapi>=0.135.1",
    "google-genai>=1.60.0",
    "joblib>=1.5.3",
    "jupyter>=1.0.0",
    "langchain-google-genai>=4.2.0",
    "langgraph>=1.0.5",
    "langsmith>=0.5.2",
    "matplotlib>=3.7.2",
    "mlflow>=3.10.1",
    "numpy>=1.26.4",
    "optuna>=4.8.0",
    "pandas>=2.3.3",
    "pydantic>=2.12.5",
    "pytdc>=0.3.6",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "rdkit>=2026.3.2",
    "scikit-learn>=1.8.0",
    "tdc>=0.1",
    "uvicorn>=0.42.0",
    "xgboost>=3.2.0",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
