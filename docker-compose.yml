services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      CENTAURDRUG_MODEL_ROOT: /app/models/admet_xgboost
      CENTAURDRUG_ALLOWED_MODEL_ROOTS: /app/models/admet_xgboost
      CENTAURDRUG_REQUIRE_MODELS_ON_STARTUP: "1"
    volumes:
      - ${CENTAURDRUG_HOST_MODEL_ROOT:-./models/admet_xgboost}:/app/models/admet_xgboost:ro
    ports:
      - "8000:8000"

  mlflow-postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: mlflow
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${MLFLOW_POSTGRES_PASSWORD:?Set MLFLOW_POSTGRES_PASSWORD}
    volumes:
      - mlflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow"]
      interval: 5s
      timeout: 5s
      retries: 20

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    depends_on:
      mlflow-artifacts-init:
        condition: service_completed_successfully
      mlflow-migrate:
        condition: service_completed_successfully
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://mlflow:${MLFLOW_POSTGRES_PASSWORD:?Set MLFLOW_POSTGRES_PASSWORD}@mlflow-postgres:5432/mlflow
      MLFLOW_AUTH_DATABASE_URI: postgresql+psycopg2://mlflow:${MLFLOW_POSTGRES_PASSWORD:?Set MLFLOW_POSTGRES_PASSWORD}@mlflow-postgres:5432/mlflow
      MLFLOW_ARTIFACTS_DESTINATION: file:///mlflow/artifacts
      MLFLOW_ADMIN_USERNAME: ${MLFLOW_ADMIN_USERNAME:?Set MLFLOW_ADMIN_USERNAME}
      MLFLOW_ADMIN_PASSWORD: ${MLFLOW_ADMIN_PASSWORD:?Set MLFLOW_ADMIN_PASSWORD}
      MLFLOW_FLASK_SERVER_SECRET_KEY: ${MLFLOW_FLASK_SERVER_SECRET_KEY:?Set MLFLOW_FLASK_SERVER_SECRET_KEY}
      MLFLOW_ALLOWED_HOSTS: localhost,localhost:5000,127.0.0.1,127.0.0.1:5000,mlflow,mlflow:5000
      MLFLOW_CORS_ALLOWED_ORIGINS: http://localhost:*,http://127.0.0.1:*
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
    ports:
      - "5000:5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')
      interval: 10s
      timeout: 5s
      retries: 20

  mlflow-artifacts-init:
    image: alpine:3.22.1
    user: "0:0"
    command:
      - /bin/sh
      - -ec
      - chown 10001:10001 /mlflow/artifacts
    volumes:
      - mlflow-artifacts:/mlflow/artifacts

  mlflow-migrate:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    depends_on:
      mlflow-postgres:
        condition: service_healthy
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://mlflow:${MLFLOW_POSTGRES_PASSWORD:?Set MLFLOW_POSTGRES_PASSWORD}@mlflow-postgres:5432/mlflow
      MLFLOW_AUTH_DATABASE_URI: postgresql+psycopg2://mlflow:${MLFLOW_POSTGRES_PASSWORD:?Set MLFLOW_POSTGRES_PASSWORD}@mlflow-postgres:5432/mlflow
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        mlflow db upgrade "$${MLFLOW_BACKEND_STORE_URI}"
        python -m mlflow.server.auth db upgrade \
          --url "$${MLFLOW_AUTH_DATABASE_URI}"

volumes:
  mlflow-artifacts:
  mlflow-postgres-data:
